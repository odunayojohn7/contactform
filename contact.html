<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {    
--color-lighterGreen: hsl(148, 38%, 91%);
--color-mediumGreen: hsl(169, 82%, 27%);
--color-Red: hsl(0, 66%, 54%);
--color-White: hsl(0, 0%, 100%);
--color-mediumGrey: hsl(186, 15%, 59%);
--color-darkerGrey: hsl(187, 24%, 22%);
--font-karla : "karla", sans-serif;
      }
      
    span{
        color: var(--color-mediumGreen)
    }

    label{
        font-weight: 500;
        color:var(--color-darkerGrey);
        
        
    }
    </style>
   
</head>
<body class="bg-lighterGreen flex items-center justify-center w-full min-h-screen ">
    <form class="flex flex-col gap-[5px] bg-White w-[80%] lg:w-[60%] rounded-lg p-5 font-karla">
        <h1 class="text-[30px] text-darkerGrey font-semibold      ">Contact Us</h1>

        <div class="lg:flex lg:w-full lg:gap-5">

        <div class="lg:flex lg:flex-col lg:w-1/2">
            <label class="block " for="firstName">
            First Name <span>*</span>
        </label>
        <input  class="border border-darkerGrey block w-full rounded-sm p-3
         focus:border-mediumGreen focus:cursor-pointer"
          id="firstName" type="text">
        </div>

        <div class="lg:flex lg:flex-col lg:w-1/2">
            <label for="lastName">

            Last Name <span>*</span>
        </label>
        <input class="border border-darkerGrey block w-full rounded-sm p-3 
        focus:border-mediumGreen focus:cursor-pointer"
        id="lastName" type="text">
        </div>
    
       </div>


         <label for="email">
            Email Address <span>*</span>
        </label>
        <input  class="border border-darkerGrey block w-full rounded-sm p-3
         focus:border-mediumGreen focus:cursor-pointer"
         id="email" type="email">


        <label for="query">Query Type <span>*</span></label>


        <div id="query" class="flex flex-col gap-5">
        <div class="border border-darkerGreen py-5 px-3 rounded-md flex  items-center  gap-3
         has-[:checked]:bg-lighterGreen
         has-[:checked]:border-mediumGreen accent-mediumGreen">
            <input id="enquiry" type="radio" name="query">
            <label for="enquiry">General Enquiry</label>
        </div>

   
        <div class="border border-darkerGreen py-5 px-3 
        rounded-md flex  items-center 
         gap-3 has-[:checked]:bg-lighterGreen
         has-[:checked]:border-mediumGreen accent-mediumGreen">
            <input id="support" type="radio" name="query">
            <label for="support">Support Request</label>
        </div>
        </div>


        <label for="message">Message <span>*</span></label>
        <textarea class="h[150px] p-3 rounded-md border  border-darkerGrey 
        focus:cursor-pointer
        focus:border-mediumGreen " 
        name="message" id="message"></textarea>


        <div class="py-3 flex items-center gap-5">
            <input class="checked: bg-mediumGreen" id="consent" type="checkbox">
            <label class="hover:cursor-pointer" for="consent">I consent to being contacted by the team <span>*</span></label>
        </div>


        
        <button class="w-full h-[48px] text-white bg-mediumGreen rounded-md" type="submit">Submit</button>
    </form>
    </form>
    
</body>
</html>
